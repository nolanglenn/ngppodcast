name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit / integration tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (mock data, no real credentials needed)
        run: npm run build
        env:
          MOCK_DATA: 'true'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: e2e smoke tests
        run: npm run test:e2e
